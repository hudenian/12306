brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# broker 向 namesrv 注册的地址。业务服务跑在宿主机、compose 端口只发布到
# 127.0.0.1,所以这里必须是 127.0.0.1,否则客户端拿到不可达的地址。
brokerIP1 = 127.0.0.1

listenPort = 10911
namesrvAddr = rocketmq-namesrv:9876
