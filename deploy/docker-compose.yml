name: index12306

services:
  mysql:
    image: mysql:8.0
    container_name: 12306-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=1
      - --max_connections=2000
      - --max_allowed_packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      # 宿主机 3306 落在 Windows 保留端口段 3217-3316 内,改用 13306
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: 12306-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: 12306-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SW5kZXgxMjMwNk5hY29zQXV0aFRva2VuU2VjcmV0S2V5MjAyNkZvckxvY2FsRGV2T25seQ==
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: "18000"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: index12306security
      NACOS_AUTH_CACHE_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
      - "127.0.0.1:9849:9849"
    volumes:
      - ./nacos-docker-startup.sh:/home/nacos/bin/docker-startup.sh:ro
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: 12306-rocketmq-namesrv
    restart: unless-stopped
    # 镜像默认以 uid 3000(rocketmq) 运行,但 /home/rocketmq/logs 在镜像中不存在,
    # Docker 新建的命名卷属主为 root 会导致不可写,故本地开发直接以 root 运行。
    user: root
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      TZ: Asia/Shanghai
    command: sh mqnamesrv
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n 127.0.0.1:9876 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: 12306-rocketmq-broker
    restart: unless-stopped
    user: root
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      TZ: Asia/Shanghai
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    ports:
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
      - "127.0.0.1:10912:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 2>/dev/null | grep -q broker-a || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: 12306-sentinel
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      # 该镜像忽略 JAVA_OPTS,容器内固定监听 8858;
      # 业务服务配置的是 localhost:8686,故做端口转换。
      - "127.0.0.1:8686:8858"

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
